<?xml version="1.0" encoding="utf-8" standalone="no"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en" metal:define-macro="layout"> 
	<head> 
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" /> 
		
		<meta http-equiv="content-language" content="en" /> 
		
		<link rel="icon" type="image/ico" href="./img/favicon.ico" tal:attributes="href string:${url_skin}img/favicon.ico" /> 
		
		<link rel="shortcut icon" type="image/ico" tal:attributes="href string:${url_skin}img/favicon.ico" /> 
		
		<title tal:define="global page_title string:${title} - ${title_app}" tal:content="page_title">RudFin</title> 
		
		<meta name="title" content="title" tal:attributes="content page_title" />
		
		<meta name="subject" content="subject" tal:attributes="content page_title" />
		
		<meta name="description" content="description" tal:condition="exists:meta" tal:attributes="content meta/description" />
		
		<meta name="keywords" content="keywords" tal:condition="exists:meta" tal:attributes="content meta/keywords" />
		
		<meta name="copyright" content="Copyright &copy; 2010 - 2011 RudiSoft.Net All rights reserved" />
		
		<meta name="designer" content="Radu Maier, RudiSoft.Net" />
		
		<meta name="publisher" content="Radu Maier, RudiSoft.Net" />
		
		<meta name="author" content="Radu Maier, RudiSoft.Net" />
		
		<meta name="rating" content="General" />
		
		<meta name="distribution" content="Global" />
		
		<meta name="robots" content="Index, Follow" />
		
		<meta http-equiv="Content-Style-Type" content="text/css" /> 
		
		<link rel="stylesheet" type="text/css" charset="utf-8" media="screen" href="./css/layout.css" tal:attributes="href string:${url_skin}css/layout.css" />
		
		<link rel="stylesheet" type="text/css" charset="utf-8" media="screen" href="./css/home.css" tal:attributes="href string:${url_skin}css/${page}.css" class="ajax" />
		
		<tal:block metal:use-macro="layout_scripts.xhtml/scripts_top"></tal:block> 
		 
	</head> 
	<body>
		
		<!-- CUSTOM TOP START -->
		<div class="container top">
			&#160;
		</div>
		<!-- CUSTOM TOP END -->
		
		<!-- NAVIGATION START -->
		<div class="container navigation">
			&#160;
		</div>
		<!-- NAVIGATION END -->
		
		<!-- HEADER START -->
		<div class="container header">
			&#160;
		</div>
		<!-- HEADER END -->
		
		<!-- CUSTOM CONTENT START -->
		<div class="container wrapper">
			<div class="container main">
				
				<div class="content" id="content-main">
					<tal:block metal:define-slot="content-main" />
				</div>

				<div class="clear">&#160;</div>
			</div>
		</div>
		<!-- CUSTOM CONTENT END -->
		
		<!-- FOOTER START -->
		<div class="container footer">
			&#160;
		</div>
		<!-- FOOTER END -->
		
		<tal:block metal:use-macro="layout_scripts.xhtml/scripts_bottom"></tal:block>
		
	</body>
</html>
