	<tal:block metal:use-macro="layout.xhtml/layout">
		
		<tal:block metal:fill-slot="content-header">
			
			<p>
			Lorem ipsum dolor sit amet, consectetur adipiscing elit.
			</p>
		</tal:block>
		
		<tal:block metal:fill-slot="content-main">
		
			<h1 tal:content="title">Title</h1>
			<br />
			
			<table class="books">
				<tr>
					<th rowspan="2">No.</th>
					
					<th style="width: 100px;" rowspan="2">Date</th>
					
					<th rowspan="2">Document</th>
					
					<th rowspan="2">Notes</th>
					
					<th colspan="2">Income</th>
					
					<th colspan="2">Payment</th>
					
				</tr>
				
				<tr>
					
					<th>cash</th>
					
					<th>bank</th>
					
					<th>cash</th>
					
					<th>bank</th>
					
				</tr>
				<tr tal:repeat="book books">
					
					<td class="align-right" tal:content="book/book_number">&#160;</td>
					
					<td tal:content="book/book_date">&#160;</td>
					
					<td tal:content="book/book_document">&#160;</td>
					
					<td tal:content="book/book_notes">&#160;</td>
					
					<td class="align-right">
						&#160;
						<tal:block tal:condition="php: book['book_account'] EQ 'cash'">
							<span tal:condition="php: book['book_type'] EQ 'income'" tal:content="book/book_amount"></span>
						</tal:block>
					</td>
					
					<td class="align-right">
						&#160;
						<tal:block tal:condition="php: book['book_account'] EQ 'bank'">
							<span tal:condition="php: book['book_type'] EQ 'income'" tal:content="book/book_amount"></span>
						</tal:block>
					</td>
					
					<td class="align-right">
						&#160;
						<tal:block tal:condition="php: book['book_account'] EQ 'cash'">
							<span tal:condition="php: book['book_type'] EQ 'payment'" tal:content="book/book_amount"></span>
						</tal:block>
					</td>
					
					<td class="align-right">
						&#160;
						<tal:block tal:condition="php: book['book_account'] EQ 'bank'">
							<span tal:condition="php: book['book_type'] EQ 'payment'" tal:content="book/book_amount"></span>
						</tal:block>
					</td>
					
				</tr>
			</table>
			
		</tal:block>
		
	</tal:block>
